[project]
name = "seolens"
version = "0.1.0"
description = "SEO LENS: offline-first keyword + page-fit tool for blog.4xela.ai"
requires-python = ">=3.9"   # 3.9/3.10 need: pip install tomli
dependencies = []            # stdlib only

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
seo-lens = "seolens.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
